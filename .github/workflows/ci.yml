name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install bandit
      - run: bandit -r src/ -x src/tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install mypy
      - run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ --cov=src --cov-report=xml --cov-report=term --cov-fail-under=80
      - uses: codecov/codecov-action@v3
        if: success()

  integration:
    runs-on: ubuntu-latest
    needs: [lint, security, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest integration_tests/ -v
      - name: Docker Compose smoke test
        run: |
          docker compose -f docker-compose.yml up -d --build --wait api
          python3 -c "
import httpx, time
for i in range(30):
    try:
        r = httpx.get('http://localhost:8000/api/v1/health', timeout=5)
        if r.status_code == 200:
            print(f'API healthy after {i+1}s')
            break
    except Exception:
        pass
    time.sleep(1)
else:
    print('API failed to start')
    exit(1)
"
          docker compose -f docker-compose.yml down

  build:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -f docker/Dockerfile.api -t ghcr.io/${{ github.repository }}/api:latest .
          docker build -f docker/Dockerfile.dashboard -t ghcr.io/${{ github.repository }}/dashboard:latest .
      - run: |
          echo "Docker images built successfully"
          echo "Push manually with: docker push ghcr.io/${{ github.repository }}/api:latest"
